version: '3.8'

services:
  # Main application
  techshop-cloud:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:techshop_dev
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - techshop-network

  # PostgreSQL for production-like testing
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: techshop_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - techshop-network
    profiles:
      - prod-test

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - techshop-network
    profiles:
      - prod-test

  # Adminer for database management
  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - techshop-network
    profiles:
      - prod-test

volumes:
  postgres_data:
  redis_data:

networks:
  techshop-network:
    driver: bridge 